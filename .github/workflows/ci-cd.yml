name: React 项目 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 权限设置（部署 Pages 需要）
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发运行
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ========== 第一阶段：代码检查 ==========
  
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'  # 启用 npm 缓存，加快安装速度
      
      - name: 安装依赖
        run: npm ci  # npm ci 比 npm install 更快、更可靠
      
      - name: 运行 ESLint
        run: npm run lint
      
      - name: 检查类型（如果有 TypeScript）
        run: npm run type-check || echo "⚠️ 没有类型检查"

  # ========== 第二阶段：单元测试 ==========
  
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 运行测试
        run: npm test -- --coverage
      
      - name: 上传测试覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ========== 第三阶段：构建 ==========
  
  build:
    name: 构建打包
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 构建项目
        run: npm run build
      
      - name: 验证构建输出
        run: |
          echo "📦 构建产物大小："
          du -sh dist/
          echo "📁 文件列表："
          ls -la dist/
      
      - name: 生成版本信息
        run: |
          cat > dist/version.json << EOF
          {
            "version": "v1.0.${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "commitMessage": "${{ github.event.head_commit.message }}",
            "buildTime": "$(date -Iseconds)",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  # ========== 第四阶段：部署 ==========
  
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'  # 只在 main 分支部署
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      
      - name: 打印部署信息
        run: |
          echo "🚀 开始部署..."
          echo "部署时间：$(date)"
          cat dist/version.json
      
      - name: 设置 Pages
        uses: actions/configure-pages@v4
      
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'
      
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: 打印完成消息
        run: |
          echo "✅ 部署完成！"
          echo "访问地址：${{ steps.deployment.outputs.page_url }}"